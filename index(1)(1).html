<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ffcc00 100%);
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 1.428em;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .score-board {
            color: #fff;
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .score-board span {
            color: #0066cc;
            font-weight: 900;
            font-size: 1.4em;
            background: #fff;
            padding: 2px 10px;
            border-radius: 15px;
        }

        canvas {
            border: 4px solid #fff;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            background: #1a472a;
        }

        .controls {
            margin-top: 20px;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .controls p {
            margin: 5px 0;
        }

        .btn {
            background: #0066cc;
            color: #fff;
            border: 3px solid #fff;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #0052a3;
            transform: scale(1.08);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary {
            background: #e60026;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #cc0022;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            padding: 40px;
            border-radius: 20px;
            border: 4px solid #fff;
            display: none;
            min-width: 300px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .game-over h2 {
            color: #ffcc00;
            font-size: 2.2em;
            margin-bottom: 20px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .game-over p {
            color: #fff;
            font-size: 1.3em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .wrapper {
            position: relative;
            display: inline-block;
        }

        .quiz-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            padding: 24px;
            border-radius: 16px;
            border: 4px solid #ffcc00;
            display: none;
            min-width: 280px;
            max-width: 320px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .quiz-modal h3 {
            color: #ffcc00;
            font-size: 1.3em;
            margin-bottom: 16px;
            font-weight: 900;
        }

        .quiz-modal .question {
            color: #fff;
            font-size: 1em;
            margin-bottom: 16px;
            line-height: 1.5;
            font-weight: bold;
        }

        .quiz-modal .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-modal .option-btn {
            background: #fff;
            color: #0066cc;
            border: 3px solid #ffcc00;
            padding: 10px 16px;
            font-size: 0.9em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .quiz-modal .option-btn:hover {
            background: #ffcc00;
            color: #000;
            transform: scale(1.02);
        }

        .quiz-modal .timer {
            color: #ffcc00;
            font-size: 1.1em;
            margin-top: 12px;
            font-weight: 900;
        }

        .settings-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);

            border-radius: 20px;
            border: 4px solid #fff;

        }

        .settings-modal h2 {
            color: #ffcc00;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .question-list {
            margin-bottom: 20px;
        }

        .question-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: left;
            border: 2px solid rgba(255, 255, 255, 0.3);

        .question-item input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 2px solid #ffcc00;
            border-radius: 5px;
            background: #fff;
            color: #333;
        }

        .question-item .options-input {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .question-item label {
            color: #fff;
            font-size: 0.9em;
            font-weight: bold;
        }

        .add-question-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;

        .overlay {

            left: 0;

            display: none;

            gap: 10px;
            justify-content: center;
            align-items: center;
        }

            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            border: 3px solid #fff;
            border-radius: 15px;
            color: #fff;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-btn:active {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

            background: linear-gradient(135deg, #0077ee 0%, #0055aa 100%);
        }

        @media (max-width: 768px) {
            .touch-controls {
                display: flex;
                flex-direction: column;
            }
            
            canvas {
                max-width: 100%;
                height: auto;
            }
            
            .controls {
                display: none;
            }

</head>
<body>
    <div class="game-container">
        <h1>知识跑道贪吃蛇</h1>
        <div class="score-board">
            得分: <span id="score">0</span> | 最高分: <span id="highScore">0</span> | 🥇 答题奖励
        </div>
        <div class="wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div class="game-over" id="gameOver">
                <h2>游戏结束!</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <button class="btn" onclick="startGame()">重新开始</button>
            </div>

            <div class="quiz-modal" id="quizModal">
                <h3>🥇 答题挑战</h3>
                <div class="hint-box">答对获得5分奖励！答错游戏结束！</div>
                <div class="question" id="quizQuestion"></div>
                <div class="options" id="quizOptions"></div>
                <div class="timer">剩余时间: <span id="quizTimer">10</span> 秒</div>
            </div>
        </div>
        <div class="controls">
            <p>使用方向键 ↑ ↓ ← → 控制蛇的移动 | 空格键暂停</p>
            <p>🥇 触碰金牌触发答题挑战</p>
        </div>
        
        <div class="touch-controls">
            <div class="touch-controls-row">
                <button class="touch-btn" onclick="changeDirection('up')">↑</button>
            </div>
            <div class="touch-controls-row">
                <button class="touch-btn" onclick="changeDirection('left')">←</button>
                <button class="touch-btn" onclick="changeDirection('down')">↓</button>
                <button class="touch-btn" onclick="changeDirection('right')">→</button>
            </div>
            <div class="touch-controls-row" style="margin-top: 10px;">
                <button class="touch-btn" onclick="togglePause()" style="width: 150px; font-size: 1.2em;">⏸️ 暂停</button>
            </div>
        </div>
        
        <div>
            <button class="btn" onclick="startGame()">开始游戏</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeSettings()"></div>

    <div class="settings-modal" id="settingsModal">
        <h2>📝 自定义题目</h2>
        <div class="hint-box">设置你喜欢的题目，答对可获得5分奖励！</div>
        <div class="question-list" id="questionList"></div>
        <button class="add-question-btn" onclick="addQuestion()">+ 添加题目</button>
        <div>
            <button class="btn" onclick="saveSettings()">保存设置</button>
            <button class="btn" onclick="closeSettings()" style="background: #888;">取消</button>
        </div>
    </div>

    <script>

            { question: "乒乓球发球擦网应？", options: ["重发", "对方得分", "本方得分", "换发球"], correct: 0 },
            { question: "下列属于田径项目的是？", options: ["跳水", "马拉松", "击剑", "举重"], correct: 1 },
            { question: "足球禁区内手球通常判？", options: ["角球", "点球", "任意球", "边线球"], correct: 1 },

            { question: "现代奥运会起源于？", options: ["美国", "希腊", "法国", "英国"], correct: 1 },
            { question: "全红婵在东京奥运会夺冠项目是？", options: ["射击", "跳水", "游泳", "体操"], correct: 1 },
            { question: "羽毛球一局先到多少分获胜？", options: ["11", "15", "21", "25"], correct: 2 },
            { question: "下列属于冬奥会项目的是？", options: ["田径", "冰壶", "乒乓球", "游泳"], correct: 1 },

            { question: "世界杯足球赛冠军奖杯是？", options: ["大力神杯", "欧洲杯", "冠军杯", "美洲杯"], correct: 0 },
            { question: "我国第一次举办夏季奥运会是？", options: ["2008北京", "2010广州", "2022北京", "2018平昌"], correct: 0 }

        let customQuestions = defaultQuestions;

        highScoreElement.textContent = highScore;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            food = {};
            goldMedal = null;
            askedQuestions = [];
            generateFood();
            isGameRunning = true;
            isPaused = false;
            isInQuiz = false;
            isInvincible = false;
            gameOverElement.style.display = 'none';
            quizModal.style.display = 'none';
            
            if (medalSpawnTimer) clearInterval(medalSpawnTimer);
            if (invincibleTimer) clearTimeout(invincibleTimer);
            medalSpawnTimer = setInterval(() => {
                if (isGameRunning && !isPaused && !isInQuiz && !goldMedal) {
                    generateGoldMedal();
                }
            }, 4000);
        }

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (isPositionOccupied(newFood));
            food = newFood;
        }

        function generateGoldMedal() {
            if (Math.random() > 0.2) {
                let newMedal;
                do {
                    newMedal = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };
                } while (isPositionOccupied(newMedal));
                goldMedal = newMedal;
            }
        }

        function isPositionOccupied(pos) {
            for (let segment of snake) {
                if (segment.x === pos.x && segment.y === pos.y) return true;
            }
            if (food.x === pos.x && food.y === pos.y) return true;
            if (goldMedal && goldMedal.x === pos.x && goldMedal.y === pos.y) return true;
            return false;
        }

        function drawGoldMedal(cx, cy, radius) {
            // 绘制金牌主体
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffd700';
            ctx.fill();
            
            // 绘制金牌中间的圆圈
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffed4e';
            ctx.fill();
            
            // 绘制金牌上的条纹
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.8, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffed4e';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.shadowBlur = 0;
        }

        function drawGame() {
            ctx.fillStyle = '#2d5a3d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            ctx.fillStyle = '#ff6b35';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff6b35';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            if (goldMedal) {
                drawGoldMedal(
                    goldMedal.x * gridSize + gridSize / 2,
                    goldMedal.y * gridSize + gridSize / 2,
                    gridSize / 2 - 2
                );
            }

            snake.forEach((segment, index) => {
                if (isInvincible) {
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffd700';
                } else if (index === 0) {
                    ctx.fillStyle = '#0066cc';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#0066cc';
                } else {
                    const gradient = index / snake.length;
                    ctx.fillStyle = `hsl(210, 100%, ${50 + gradient * 15}%)`;
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
                
                if (index === 0) {
                    ctx.fillStyle = '#ffcc00';
                    ctx.shadowBlur = 0;
                    const eyeSize = 3;
                    
                    if (dx > 0) {
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
                    } else if (dx < 0) {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
                    } else if (dy < 0) {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
                    }
                }
            });
            ctx.shadowBlur = 0;
        }

        function updateGame() {
            if (isPaused || !isGameRunning || isInQuiz) return;

            const head = { x: snake[0].x + dx / gridSize, y: snake[0].y + dy / gridSize };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                if (!isInvincible) {
                    gameOver();
                    return;
                }
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    if (!isInvincible) {
                        gameOver();
                        return;
                    }
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 2;
                scoreElement.textContent = score;
                generateFood();
            } else if (goldMedal && head.x === goldMedal.x && head.y === goldMedal.y) {
                pendingScore = 5;
                goldMedal = null;
                showQuiz();
            } else {
                snake.pop();
            }
        }

        function showQuiz() {
            isInQuiz = true;
            isPaused = true;
            
            // 如果所有问题都问过了，重置已问问题列表
            if (askedQuestions.length >= customQuestions.length) {
                askedQuestions = [];
            }
            
            // 从未问过的问题中随机选择
            let availableQuestions = customQuestions.filter((_, index) => !askedQuestions.includes(index));
            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            const quizIndex = customQuestions.indexOf(availableQuestions[randomIndex]);
            
            // 添加到已问问题列表
            askedQuestions.push(quizIndex);
            
            const quiz = customQuestions[quizIndex];
            
            quizQuestion.textContent = quiz.question;
            quizOptions.innerHTML = '';
            
            quiz.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => answerQuiz(index === quiz.correct);
                quizOptions.appendChild(btn);
            });
            
            quizModal.style.display = 'block';
            
            let timeLeft = 10;
            quizTimer.textContent = timeLeft;
            
            if (quizTimerInterval) clearInterval(quizTimerInterval);
            quizTimerInterval = setInterval(() => {
                timeLeft--;
                quizTimer.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(quizTimerInterval);
                    answerQuiz(false);
                }
            }, 1000);
        }

        function answerQuiz(isCorrect) {
            clearInterval(quizTimerInterval);
            quizModal.style.display = 'none';
            isInQuiz = false;
            
            if (isCorrect) {
                score += pendingScore;
                scoreElement.textContent = score;
                for (let i = 0; i < 2; i++) {
                    snake.push({...snake[snake.length - 1]});
                }
                // 添加两秒钟无敌状态
                isInvincible = true;
                if (invincibleTimer) clearTimeout(invincibleTimer);
                invincibleTimer = setTimeout(() => {
                    isInvincible = false;
                }, 2000);
            } else {
                alert('❌ 回答错误！游戏结束！');
                gameOver();
                return;
            }
            
            pendingScore = 0;
            isPaused = false;
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoop);
            if (medalSpawnTimer) clearInterval(medalSpawnTimer);
            if (quizTimerInterval) clearInterval(quizTimerInterval);
            if (invincibleTimer) clearTimeout(invincibleTimer);
            
            if (score > highScore) {
                highScore = score;
                highScoreElement.textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }
            
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }

        function startGame() {
            if (gameLoop) clearInterval(gameLoop);
            initGame();
            drawGame();
            gameLoop = setInterval(() => {
                updateGame();
                drawGame();
            }, 140);
        }

        function openSettings() {
            renderQuestionList();
            settingsModal.style.display = 'block';
            overlay.style.display = 'block';
        }

        function closeSettings() {
            settingsModal.style.display = 'none';
            overlay.style.display = 'none';
        }

        function renderQuestionList() {
            questionList.innerHTML = '';
            customQuestions.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = 'question-item';
                item.innerHTML = `
                    <label>问题 ${index + 1}:</label>
                    <input type="text" placeholder="输入问题" value="${q.question}" id="q-${index}">
                    <div class="options-input">
                        <div>
                            <label>选项 A:</label>
                            <input type="text" placeholder="选项A" value="${q.options[0]}" id="q-${index}-opt0">
                        </div>
                        <div>
                            <label>选项 B:</label>
                            <input type="text" placeholder="选项B" value="${q.options[1]}" id="q-${index}-opt1">
                        </div>
                        <div>
                            <label>选项 C:</label>
                            <input type="text" placeholder="选项C" value="${q.options[2]}" id="q-${index}-opt2">
                        </div>
                        <div>
                            <label>选项 D:</label>
                            <input type="text" placeholder="选项D" value="${q.options[3]}" id="q-${index}-opt3">
                        </div>
                    </div>
                    <label style="display: block; margin-top: 10px;">正确答案 (0=A, 1=B, 2=C, 3=D):</label>
                    <input type="number" min="0" max="3" value="${q.correct}" id="q-${index}-correct" style="width: 100px;">
                    <button class="delete-btn" onclick="deleteQuestion(${index})">删除</button>
                `;
                questionList.appendChild(item);
            });
        }

        function addQuestion() {
            customQuestions.push({
                question: "新问题",
                options: ["选项A", "选项B", "选项C", "选项D"],
                correct: 0
            });
            renderQuestionList();
        }

        function deleteQuestion(index) {
            if (customQuestions.length > 1) {
                customQuestions.splice(index, 1);
                renderQuestionList();
            } else {
                alert('至少保留一道题目！');
            }
        }

        function saveSettings() {
            customQuestions = customQuestions.map((q, index) => ({
                question: document.getElementById(`q-${index}`).value,
                options: [
                    document.getElementById(`q-${index}-opt0`).value,
                    document.getElementById(`q-${index}-opt1`).value,
                    document.getElementById(`q-${index}-opt2`).value,
                    document.getElementById(`q-${index}-opt3`).value
                ],
                correct: parseInt(document.getElementById(`q-${index}-correct`).value) || 0
            }));
            
            localStorage.setItem('snakeQuestions', JSON.stringify(customQuestions));
            closeSettings();
            alert('设置已保存！');
        }

        function changeDirection(direction) {
            if (!isGameRunning || isInQuiz) return;
            
            switch(direction) {
                case 'up':
                    if (dy === 0) {
                        dx = 0;
                        dy = -gridSize;
                    }
                    break;
                case 'down':
                    if (dy === 0) {
                        dx = 0;
                        dy = gridSize;
                    }
                    break;
                case 'left':
                    if (dx === 0) {
                        dx = -gridSize;
                        dy = 0;
                    }
                    break;
                case 'right':
                    if (dx === 0) {
                        dx = gridSize;
                        dy = 0;
                    }
                    break;
            }
        }

        function togglePause() {
            if (!isInQuiz && isGameRunning) {
                isPaused = !isPaused;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (!isGameRunning || isInQuiz) return;

            switch(e.key) {
                case 'ArrowUp':
                    changeDirection('up');
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    changeDirection('down');
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    changeDirection('left');
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    changeDirection('right');
                    e.preventDefault();
                    break;
                case ' ':
                    if (!isInQuiz) {
                        isPaused = !isPaused;
                    }
                    e.preventDefault();
                    break;
            }
        });
    </script>
</body>
</html>
