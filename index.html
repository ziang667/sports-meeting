<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>体育文化节</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #87CEEB;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #FFD700;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 15px;
            font-size: 36px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #000;
            border-radius: 15px;
            background: #87CEEB;
            display: block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        #gameUI {
            margin-top: 20px;
            display: flex;
            gap: 40px;
            font-size: 24px;
            font-weight: bold;
            color: #FFF;
            text-shadow: 2px 2px 0px #000;
        }
        #score, #bestScore {
            color: #FFD700;
        }
        #startButton, #restartButton {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #FF6B6B;
            color: #FFF;
            border: 2px solid #000;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 0px #000;
            transition: all 0.2s ease;
        }
        #startButton:hover, #restartButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px #000;
        }
        #startButton:active, #restartButton:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #000;
        }
        #gameOverScreen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            border: 4px solid #FFD700;
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            text-align: center;
            z-index: 1000;
            display: none;
        }
        #gameOverScreen h2 {
            color: #FFD700;
            margin-top: 0;
            font-size: 36px;
            text-shadow: 2px 2px 0px #000;
        }
        #gameOverScore {
            font-size: 24px;
            margin: 20px 0;
            color: #FFF;
            text-shadow: 2px 2px 0px #000;
        }
        #tapHint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #FFD700;
            display: none;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: translateX(-50%) scale(1);
            }
            50% {
                transform: translateX(-50%) scale(1.1);
            }
            100% {
                transform: translateX(-50%) scale(1);
            }
        }
        #questionScreen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 215, 0, 0.95);
            border: 1px solid #000;
            border-radius: 6px;
            padding: 8px;
            width: 50%;
            max-width: 150px;
            text-align: center;
            z-index: 1000;
            display: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        #questionScreen h2 {
            color: #000;
            margin-top: 0;
            font-size: 12px;
        }
        #questionText {
            font-size: 10px;
            margin: 6px 0;
            color: #333;
            font-weight: bold;
        }
        #optionsContainer {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin: 6px 0;
        }
        .optionButton {
            padding: 4px 8px;
            font-size: 8px;
            font-weight: bold;
            background: #FFF;
            color: #333;
            border: 1px solid #000;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .optionButton:hover {
            background: #FF6B6B;
            color: #FFF;
        }
        #feedbackText {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
        #feedbackText.correct {
            color: #4CAF50;
        }
        #feedbackText.incorrect {
            color: #FF6B6B;
        }
    </style>
</head>
<body>
    <h1>体育文化节</h1>
    <div style="margin-bottom: 20px;">
        <button id="startButton">开始游戏</button>
    </div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="tapHint">点击屏幕跳跃</div>
    <div id="gameUI">
        <div>得分: <span id="score">0</span></div>
        <div>最高分: <span id="bestScore">0</span></div>
    </div>
    <div id="gameOverScreen">
        <h2>游戏结束</h2>
        <div id="gameOverScore">你的得分: <span>0</span></div>
        <button id="restartButton">再来一局</button>
    </div>
    <div id="questionScreen">
        <h2>问答时间！</h2>
        <div id="questionText">问题将显示在这里</div>
        <div id="optionsContainer">
            <!-- 选项按钮将在这里动态生成 -->
        </div>
        <div id="feedbackText"></div>
    </div>
    <script src="game.js"></script>
</body>
</html>
